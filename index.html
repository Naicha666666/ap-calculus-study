 .topic-link{display:flex;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--border);padding:14px 6px;cursor:pointer;gap:12px;align-items:center;color:var(--ink)}.topic-link:hover{background:#f2efff;color:var(--brand)}.topic-link:last-child{border-bottom:0}.topic-link span:first-child{flex:1}.deep-example{padding:18px 0;border-top:1px solid #e6e8f1}.deep-example summary{cursor:pointer;list-style-position:inside}.deep-example[open] summary{margin-bottom:15px}.deep-example h3{margin:9px 0}.deep-example .note{margin-top:12px}</style></head><body><header><div class="brand">∫ <b>Calculus</b> Atlas<small>2.0 · AB / BC</small></div><div class="right"><select id="course" class="select" aria-label="Course"><option value="all">AB + BC</option><option value="ab">AP Calculus AB</option><option value="bc">AP Calculus BC</option></select><select id="lang" class="select" aria-label="Language"><option value="both">中 / EN</option><option value="zh">中文</option><option value="en">English</option></select></div></header><div class="shell"><aside id="nav"></aside><main id="content"></main></div><script>
const D={"chapters":[{"en":"Functions","zh":"函数","tag":"AB/BC","descEn":"Functions, domains, inverses and graphs","descZh":"函数、定义域、反函数与图像"},{"en":"Limits and Continuity","zh":"极限与连续","tag":"AB/BC","descEn":"Limits, asymptotes and continuity","descZh":"极限、渐近线与连续性"},{"en":"Differentiation","zh":"求导","tag":"AB/BC","descEn":"Derivative rules, chain rule and implicit differentiation","descZh":"求导法则、链式法则与隐函数求导"},{"en":"Applications of Differential Calculus","zh":"导数的应用","tag":"AB/BC","descEn":"Extrema, motion, optimization and related rates","descZh":"极值、运动、优化与相关变化率"},{"en":"Antidifferentiation","zh":"不定积分","tag":"AB/BC","descEn":"Antiderivatives and integration techniques","descZh":"原函数与积分技巧"},{"en":"Definite Integrals","zh":"定积分","tag":"AB/BC","descEn":"FTC, Riemann sums and average value","descZh":"微积分基本定理、黎曼和与平均值"},{"en":"Applications of Integration to Geometry","zh":"积分的几何应用","tag":"AB/BC","descEn":"Area, volume and arc length","descZh":"面积、体积与弧长"},{"en":"Further Applications of Integration","zh":"积分的进一步应用","tag":"AB/BC","descEn":"Accumulation and net change","descZh":"累积量与净变化"},{"en":"Differential Equations","zh":"微分方程","tag":"AB/BC","descEn":"Slope fields, separable equations and growth","descZh":"斜率场、可分离方程与增长模型"},{"en":"Sequences and Series","zh":"数列与级数","tag":"BC ONLY","descEn":"Convergence, power series and Taylor series","descZh":"收敛性、幂级数与泰勒级数"}],"questions":[{"ch":0,"en":"What is the domain of f(x)=√(x−3)?","zh":"f(x)=√(x−3) 的定义域是什么？","optsEn":["x≥3","x>0","x≤3","all real x"],"optsZh":["x≥3","x>0","x≤3","所有实数"],"correct":0,"expEn":"The radicand must be nonnegative: x−3≥0.","expZh":"根号内必须非负：x−3≥0。","hintEn":"Consider the square root restriction.","hintZh":"考虑平方根的定义条件。","id":"original-1","type":"mcq","difficulty":1,"bc":false,"topic":"Core review / 核心复习"},{"ch":0,"en":"If f(x)=2x+5, find f⁻¹(x).","zh":"若 f(x)=2x+5，求反函数。","optsEn":["(x−5)/2","2x−5","(x+5)/2","1/(2x+5)"],"optsZh":["(x−5)/2","2x−5","(x+5)/2","1/(2x+5)"],"correct":0,"expEn":"Swap x and y in y=2x+5, then solve for y.","expZh":"交换 x、y 后解出 y。","hintEn":"Reverse the input-output relationship.","hintZh":"将输入输出关系反过来。","id":"original-2","type":"mcq","difficulty":2,"bc":false,"topic":"Core review / 核心复习"},{"ch":0,"en":"What is the period of sin(2x)?","zh":"sin(2x) 的周期是多少？","optsEn":["π","2π","π/2","4π"],"optsZh":["π","2π","π/2","4π"],"correct":0,"expEn":"The period of sin(bx) is 2π/|b|, so π.","expZh":"sin(bx) 的周期是 2π/|b|，所以是 π。","hintEn":"Think about horizontal compression.","hintZh":"考虑图像的水平压缩。","id":"original-3","type":"mcq","difficulty":3,"bc":false,"topic":"Core review / 核心复习"},{"ch":1,"en":"Evaluate lim(x→2) (x²−4)/(x−2).","zh":"求 lim(x→2) (x²−4)/(x−2)。","optsEn":["4","0","2","undefined"],"optsZh":["4","0","2","不存在"],"correct":0,"expEn":"Factor x²−4=(x−2)(x+2), cancel and substitute x=2.","expZh":"因式分解并约去 x−2，再代入 x=2。","hintEn":"Factor the numerator first.","hintZh":"先对分子因式分解。","id":"original-4","type":"mcq","difficulty":1,"bc":false,"topic":"Core review / 核心复习"},{"ch":1,"en":"Find lim(x→0) sin(5x)/x.","zh":"求 lim(x→0) sin(5x)/x。","optsEn":["5","1","0","∞"],"optsZh":["5","1","0","∞"],"correct":0,"expEn":"Rewrite as 5·sin(5x)/(5x); the standard sine limit equals 1.","expZh":"改写成 5·sin(5x)/(5x)，利用基本三角极限。","hintEn":"Use the standard sine limit.","hintZh":"考虑基本正弦极限。","id":"original-5","type":"mcq","difficulty":2,"bc":false,"topic":"Core review / 核心复习"},{"ch":1,"en":"For f(x)=(x²−1)/(x−1), what happens at x=1?","zh":"对 f(x)=(x²−1)/(x−1)，x=1 处是什么间断？","optsEn":["Removable discontinuity","Jump discontinuity","Vertical asymptote","No discontinuity"],"optsZh":["可去间断点","跳跃间断点","垂直渐近线","没有间断"],"correct":0,"expEn":"For x≠1 the function equals x+1, but x=1 is excluded.","expZh":"x≠1 时函数等于 x+1，但 x=1 未定义。","hintEn":"Simplify the expression away from x=1.","hintZh":"先在 x≠1 时化简。","id":"original-6","type":"mcq","difficulty":3,"bc":false,"topic":"Core review / 核心复习"},{"ch":2,"en":"Differentiate f(x)=x³−4x.","zh":"求 f(x)=x³−4x 的导数。","optsEn":["3x²−4","x²−4","3x²−4x","3x−4"],"optsZh":["3x²−4","x²−4","3x²−4x","3x−4"],"correct":0,"expEn":"Apply the power rule term by term.","expZh":"逐项使用幂函数求导法则。","hintEn":"Differentiate each term separately.","hintZh":"逐项求导。","id":"original-7","type":"mcq","difficulty":1,"bc":false,"topic":"Core review / 核心复习"},{"ch":2,"en":"Find d/dx [sin(x²)].","zh":"求 d/dx [sin(x²)]。","optsEn":["2x cos(x²)","cos(x²)","2x sin(x²)","cos(2x)"],"optsZh":["2x cos(x²)","cos(x²)","2x sin(x²)","cos(2x)"],"correct":0,"expEn":"Chain rule: derivative of outer sine times derivative of x².","expZh":"链式法则：外层正弦求导后乘以内层 x² 的导数。","hintEn":"Identify inner and outer functions.","hintZh":"识别内层与外层函数。","id":"original-8","type":"mcq","difficulty":2,"bc":false,"topic":"Core review / 核心复习"},{"ch":2,"en":"If x²+y²=25, find dy/dx.","zh":"若 x²+y²=25，求 dy/dx。","optsEn":["−x/y","−y/x","x/y","−2x/y"],"optsZh":["−x/y","−y/x","x/y","−2x/y"],"correct":0,"expEn":"Implicit differentiation gives 2x+2y·y′=0.","expZh":"隐函数求导得到 2x+2y·y′=0。","hintEn":"Remember y depends on x.","hintZh":"记住 y 是 x 的函数。","id":"original-9","type":"mcq","difficulty":3,"bc":false,"topic":"Core review / 核心复习"},{"ch":3,"en":"For f(x)=x²−6x, where is the critical point?","zh":"对 f(x)=x²−6x，临界点的 x 坐标是多少？","optsEn":["3","−3","6","0"],"optsZh":["3","−3","6","0"],"correct":0,"expEn":"f′(x)=2x−6=0 gives x=3.","expZh":"令 f′(x)=2x−6=0，得 x=3。","hintEn":"Set the first derivative to zero.","hintZh":"考虑一阶导数为零的位置。","id":"original-10","type":"mcq","difficulty":1,"bc":false,"topic":"Core review / 核心复习"},{"ch":3,"en":"If f′(x)>0 on an interval, f is…","zh":"若区间内 f′(x)>0，则 f 在该区间……","optsEn":["Increasing","Decreasing","Constant","Always concave up"],"optsZh":["递增","递减","恒定","一定凹向上"],"correct":0,"expEn":"A positive derivative means the function increases.","expZh":"正导数表示函数递增。","hintEn":"Interpret the derivative as slope.","hintZh":"将导数理解为斜率。","id":"original-11","type":"mcq","difficulty":2,"bc":false,"topic":"Core review / 核心复习"},{"ch":3,"en":"For f(x)=x³, what is f″(2)?","zh":"对 f(x)=x³，f″(2) 等于多少？","optsEn":["12","6","24","4"],"optsZh":["12","6","24","4"],"correct":0,"expEn":"f′=3x² and f″=6x; at x=2 the value is 12.","expZh":"f′=3x²，f″=6x；代入 x=2 得 12。","hintEn":"Differentiate twice.","hintZh":"连续求导两次。","id":"original-12","type":"mcq","difficulty":3,"bc":false,"topic":"Core review / 核心复习"},{"ch":4,"en":"Find ∫ 6x² dx.","zh":"求 ∫ 6x² dx。","optsEn":["2x³+C","6x³+C","3x²+C","2x²+C"],"optsZh":["2x³+C","6x³+C","3x²+C","2x²+C"],"correct":0,"expEn":"Increase the exponent by one and divide by the new exponent.","expZh":"指数加一，再除以新的指数。","hintEn":"Reverse the power rule.","hintZh":"逆用幂函数求导法则。","id":"original-13","type":"mcq","difficulty":1,"bc":false,"topic":"Core review / 核心复习"},{"ch":4,"en":"Find ∫ cos(x) dx.","zh":"求 ∫ cos(x) dx。","optsEn":["sin(x)+C","−sin(x)+C","cos(x)+C","−cos(x)+C"],"optsZh":["sin(x)+C","−sin(x)+C","cos(x)+C","−cos(x)+C"],"correct":0,"expEn":"The derivative of sin(x) is cos(x).","expZh":"sin(x) 的导数是 cos(x)。","hintEn":"Recall basic trig derivatives.","hintZh":"回忆基本三角函数的导数。","id":"original-14","type":"mcq","difficulty":2,"bc":false,"topic":"Core review / 核心复习"},{"ch":4,"en":"Find ∫ 1/x dx for x≠0.","zh":"求 ∫ 1/x dx（x≠0）。","optsEn":["ln|x|+C","1/x²+C","x ln(x)+C","−1/x+C"],"optsZh":["ln|x|+C","1/x²+C","x ln(x)+C","−1/x+C"],"correct":0,"expEn":"The antiderivative is ln|x|+C on intervals excluding zero.","expZh":"在不含 0 的区间上，原函数为 ln|x|+C。","hintEn":"Think of a logarithmic derivative.","hintZh":"想想对数函数的导数。","id":"original-15","type":"mcq","difficulty":3,"bc":false,"topic":"Core review / 核心复习"},{"ch":5,"en":"Evaluate ∫₀² 3x² dx.","zh":"计算 ∫₀² 3x² dx。","optsEn":["8","4","6","12"],"optsZh":["8","4","6","12"],"correct":0,"expEn":"An antiderivative is x³; evaluate 2³−0³=8.","expZh":"原函数为 x³，代入上下限得 8。","hintEn":"Apply the Fundamental Theorem of Calculus.","hintZh":"使用微积分基本定理。","id":"original-16","type":"mcq","difficulty":1,"bc":false,"topic":"Core review / 核心复习"},{"ch":5,"en":"Find the average value of f(x)=x on [0,4].","zh":"求 f(x)=x 在 [0,4] 上的平均值。","optsEn":["2","4"," const TD={"units":[{"en":"Limits and Continuity","zh":"极限与连续","outline":"左右极限、连续性、间断点、渐近线与介值定理","concept":"A two-sided limit exists when both one-sided limits agree.","formula":"lim(x→a) f(x)=L; continuity requires lim(x→a)f(x)=f(a).","pitfall":"左右极限不等则双侧极限不存在；介值定理保证存在而非唯一。"},{"en":"Differentiation Basics","zh":"导数定义与基本性质","outline":"差商定义、幂法则、三角函数求导、可导与连续","concept":"A derivative is the limit of a difference quotient.","formula":"f′(a)=lim(h→0)[f(a+h)−f(a)]/h; (xⁿ)′=nxⁿ⁻¹.","pitfall":"可导必连续，连续未必可导；乘积求导不是导数相乘。"},{"en":"Chain, Implicit and Inverse","zh":"链式、隐函数与反函数求导","outline":"链式法则、隐函数求导、反函数导数、高阶导数","concept":"Apply the chain rule to composite functions and implicit relationships.","formula":"[f(g(x))]′=f′(g(x))g′(x); (y²)′=2yy′.","pitfall":"隐函数中的 y 要乘 y′；反函数导数须找对应输入。"},{"en":"Contextual Differentiation","zh":"导数的情境应用","outline":"平均与瞬时变化率、运动、相关变化率、线性化、洛必达","concept":"Derivatives model instantaneous changes in real contexts.","formula":"v=s′; a=v′; L(x)=f(a)+f′(a)(x−a).","pitfall":"变化率带单位；洛必达仅适用于满足条件的未定式。"},{"en":"Analytical Differentiation","zh":"导数的分析应用","outline":"中值定理、最值定理、单调性、凹凸性、优化","concept":"Use signs of derivatives to analyze graphs and extrema.","formula":"f′>0 increasing; f″>0 concave up.","pitfall":"f′=0 不一定有极值；f″=0 不一定有拐点。"},{"en":"Integration and Accumulation","zh":"积分与累积变化","outline":"不定积分、黎曼和、微积分基本定理、换元、分部积分","concept":"Integration accumulates signed change and reverses differentiation.","formula":"∫ₐᵇf(x)dx=F(b)−F(a); ∫u dv=uv−∫v du.","pitfall":"不定积分记得 +C；定积分带符号，黎曼和要乘 Δx。"},{"en":"Differential Equations","zh":"微分方程","outline":"分离变量、斜率场、指数与逻辑斯蒂模型、欧拉法","concept":"Differential equations describe rates depending on variables.","formula":"y_next=y+hF(x,y); y′=ky ⇒ y=Ceᵏˣ.","pitfall":"每一步欧拉法要更新斜率；分离变量时检查平衡解。"},{"en":"Applications of Integration","zh":"积分的应用","outline":"平均值、位移和路程、曲线面积、体积、弧长","concept":"Integrals model averages, geometric area and volumes.","formula":"Average=(1/(b−a))∫ₐᵇf; V=π∫(R²−r²)dx.","pitfall":"位移和路程不同；体积的半径是到旋转轴的距离。"},{"en":"Parametric, Polar and Vectors","zh":"参数方程、极坐标与向量函数","outline":"参数求导、向量速度、极坐标斜率与面积","concept":"Parametric and polar forms describe curves beyond y=f(x).","formula":"dy/dx=(dy/dt)/(dx/dt); A_polar=½∫r²dθ.","pitfall":"BC 专属：极坐标区域可能重复描绘，注意积分角度范围。"},{"en":"Sequences and Series","zh":"无穷数列与级数","outline":"几何级数、p级数、比较判别、幂级数、Taylor与误差","concept":"Series convergence is about partial sums, not only individual terms.","formula":"Σarⁿ=a/(1−r) for |r|<1; Taylor Σf⁽ⁿ⁾(a)(x−a)ⁿ/n!.","pitfall":"BC 专属：通项趋零不保证级数收敛；幂级数端点需单独检验。"}],"problems":[{"unit":0,"stem":"lim(x→2)(x²−4)/(x−2)","answer":"4","explain":"约去 x−2 后代入得 4。"},{"unit":0,"stem":"lim(x→0) sin(3x)/x","answer":"3","explain":"利用 sin u/u→1，得到 3。"},{"unit":1,"stem":"d/dx (x³−5x)","answer":"3x²−5","explain":"幂法则逐项求导。"},{"unit":1,"stem":"d/dx (x²eˣ)","answer":"eˣ(x²+2x)","explain":"乘积法则：2xeˣ+x²eˣ。"},{"unit":2,"stem":"d/dx (3x+1)⁴","answer":"12(3x+1)³","explain":"链式法则乘内层导数 3。"},{"unit":2,"stem":"dy/dx for x²+y²=16","answer":"−x/y","explain":"隐函数求导：2x+2yy′=0。"},{"unit":3,"stem":"v(2) when s(t)=t³−t","answer":"11","explain":"v=3t²−1，代入 t=2 得 11。"},{"unit":3,"stem":"L(4.1) for f(x)=√x at a=4","answer":"2.025","explain":"L=2+(x−4)/4。"},{"unit":4,"stem":"critical x for f(x)=x²−6x","answer":"3","explain":"f′=2x−6=0。"},{"unit":4,"stem":"f″(2) for f(x)=x³","answer":"12","explain":"f″=6x。"},{"unit":5,"stem":"∫4x³dx","answer":"x⁴+C","explain":"幂函数积分。"},{"unit":5,"stem":"∫₀² 3x²dx","answer":"8","explain":"原函数 x³，上下限代入。"},{"unit":6,"stem":"y(1) for y′=2x, y(0)=3","answer":"4","explain":"y=x²+3，代入 x=1。"},{"unit":6,"stem":"Euler step y′=x+y, (x,y)=(0,1), h=0.1","answer":"1.1","explain":"新 y=1+0.1(0+1)。"},{"unit":7,"stem":"average value of f(x)=x on [0,4]","answer":"2","explain":"(1/4)∫₀⁴x dx=2。"},{"unit":7,"stem":"area between y=2 and y=x on [0,2]","answer":"2","explain":"∫₀²(2−x)dx=2。"},{"unit":8,"stem":"dy/dx at t=2 for x=t²,y=t³","answer":"3","explain":"(3t²)/(2t)=3t/2，代入 2。"},{"unit":8,"stem":"polar area r=2, θ from 0 to π","answer":"2π","explain":"½∫₀π4dθ=2π。"},{"unit":9,"stem":"Σ(n=0→∞)(1/2)ⁿ","answer":"2","explain":"几何级数和 1/(1−1/2)=2。"},{"unit":9,"stem":"degree-2 Maclaurin polynomial of eˣ","answer":"1+x+x²/2","explain":"利用 eˣ 在 0 处各阶导数均为 1。"}]};

const TOPIC_EXPLANATIONS=[[["Domain, range, and function notation: each input has exactly one output.","定义域是允许输入的 x 集合，值域是实际输出的 y 集合；每个 x 只能对应一个 y。","For radicals require radicand ≥0; for denominators exclude zeros.","根号内≥0；分母≠0；求反函数先交换 x、y 再解出 y。"],["Piecewise, absolute value, even/odd and inverse functions.","分段函数按 x 所属区间选用表达式；绝对值表示与 0 的距离；偶函数满足 f(−x)=f(x)。","Check endpoints and use each piece's own rule.","分段端点要核对 ≤ 和 <，不要用错分段。"],["Polynomial zeros and rational restrictions.","多项式的零点可用因式分解求出；有理函数的定义域排除分母为零的点。","Factor numerator and denominator before interpreting holes/asymptotes.","先因式分解，再区分可去间断点与垂直渐近线。"],["Trigonometric graphs, radians and periodicity.","三角函数使用弧度制；sin(bx) 与 cos(bx) 的周期为 2π/|b|。","Use sin²x+cos²x=1 and basic unit-circle values.","熟悉单位圆及恒等式；不要把角度制和弧度制混用。"],["Exponential and logarithmic inverse relationships.","eˣ 与 ln x 互为反函数；ln(ab)=ln a+ln b（a,b>0）。","Solve eˣ=a by taking ln, for a>0.","对数真数必须大于 0；ln(a+b) 不等于 ln a+ln b。"],["Parametric functions use x(t), y(t) together.","参数曲线由同一参数 t 决定坐标；消参时须保留 t 的取值限制。","Solve t from one equation and substitute into the other.","消参可能丢失方向和参数范围。"],["Polar coordinates use r and angle θ.","极坐标中 x=r cosθ，y=r sinθ，r²=x²+y²。","Convert polar equations by multiplying by r when useful.","极坐标同一点可能有多种表示，例如负半径。"]],[["A limit describes behavior as x approaches a value.","极限关注 x 趋近某值时函数的趋势，不要求该点有定义。","Compare left and right limits for a two-sided limit.","双侧极限存在必须左右极限相等。"],["Asymptotes describe unbounded or long-run behavior.","垂直渐近线常由不可约分母零点产生；水平渐近线由无穷远趋势决定。","For rational functions compare highest degrees.","有理函数同次数取最高项系数比；不要把可约去的点当渐近线。"],["Limit laws combine sums, products and quotients.","极限定律允许分别求和、乘积的极限；商法则要求分母极限不为 0。","Try direct substitution before algebraic transformations.","先直接代入；出现 0/0 只是未定式，不是答案。"],["Rational limits often simplify after factoring.","有理函数出现 0/0 时，尝试因式分解并约去公共因子。","Simplify for x≠a, then take x→a.","约去公共因子后求极限，但原函数在该点可能仍无定义。"],["Standard limits connect trig, exponential and derivative ideas.","常用极限包括 lim(x→0) sin x/x=1 与 lim(x→0)(eˣ−1)/x=1。","Rescale the inside argument carefully.","例如 sin(5x)/x 需要乘出系数 5，不能直接写 1。"],["Continuity requires matching limit and function value.","f 在 a 连续要求 f(a) 有定义、lim(x→a)f(x) 存在且等于 f(a)。","IVT applies to continuous functions on a closed interval.","介值定理需要闭区间连续；不保证零点唯一。"]],[["The derivative is a limit of difference quotients.","导数定义 f′(a)=lim(h→0)[f(a+h)−f(a)]/h，表示瞬时斜率。","Expand and cancel h before taking the limit.","不要先令 h=0 导致 0/0。"],["Power, product and quotient rules handle algebraic derivatives.","幂法则 (xⁿ)′=nxⁿ⁻¹；乘积法则 (uv)′=u′v+uv′。","For a quotient use (u′v−uv′)/v².","(uv)′ 不是 u′v′；商法则分母要平方。"],["The chain rule differentiates nested functions.","复合函数求导先对外层求导，再乘以内层导数。","For (g(x))⁵ use 5(g(x))⁴g′(x).","最常见错误是忘记乘内层导数。"],["Differentiability implies continuity, but not conversely.","可导必连续，连续不一定可导，例如 |x| 在 0 处有尖点。","Compare left and right derivatives at corners.","左右导数不同则不可导。"],["A derivative can be estimated from nearby table values.","表格题用割线斜率近似导数；中心差分常更稳定。","Compute (f(b)−f(a))/(b−a) with close endpoints.","注意分母是 x 的变化量，不是函数值变化量。"],["For parametric curves, dy/dx=(dy/dt)/(dx/dt).","参数曲线的斜率是 (dy/dt)/(dx/dt)，前提是 dx/dt≠0。","Differentiate both coordinate functions with respect to t.","不能直接把 dy/dt 当成 dy/dx。"],["Implicit differentiation treats y as a function of x.","隐函数求导时 y 依赖 x，因此 (y²)′=2yy′。","Differentiate every term then isolate y′.","含 y 的项必须乘 y′，例如 (sin y)′=cos y·y′。"],["Inverse derivatives have reciprocal slopes.","若 f(a)=b 且 f′(a)≠0，则 (f⁻¹)′(b)=1/f′(a)。","Find the original input a before using the formula.","不要直接计算 1/f′(b)，应先找 f(a)=b。"],["The Mean Value Theorem links secant and tangent slopes.","若 f 在 [a,b] 连续且 (a,b) 可导，则存在 c 使 f′(c)=[f(b)−f(a)]/(b−a)。","Check theorem conditions before solving for c.","不要漏掉连续和可导条件。"],["L’Hôpital applies to 0/0 or ∞/∞ forms under its conditions.","洛必达法则适用于满足条件的 0/0 或 ∞/∞ 未定式，对分子分母分别求导。","Verify the indeterminate form before differentiating.","不是对整个商使用商法则；也不能对普通分数直接套用。"],["Difference-quotient limits can represent derivatives.","形如 [f(a+h)−f(a)]/h 的极限就是 f′(a)。","Identify the base point a and function f.","识别 a 与 f 后再求导，避免繁琐展开。"]],[["Critical numbers occur where f′=0 or undefined, with f defined.","临界数是函数有定义而导数为零或不存在的 x。","Find f′, solve f′=0, and check nondifferentiable points.","临界点不一定是极值点。"],["Tangent slope equals derivative at the contact point.","切线方程 y−f(a)=f′(a)(x−a)。","Compute both f(a) and f′(a).","不要只给斜率，题目要求直线方程时要带过切点。"],["Derivative signs determine increasing and decreasing intervals.","f′>0 对应递增，f′<0 对应递减。","Build a sign chart around critical numbers.","求出临界数后仍需检验区间符号。"],["The second derivative describes concavity.","f″>0 凹向上，f″<0 凹向下；拐点要求凹凸性变号。","Use first-derivative signs for local extrema.","f″=0 不一定是拐点。"],["Curve sketching combines intercepts, extrema and concavity.","描图依次检查定义域、截距、渐近线、单调区间、极值、凹凸性。","Make separate sign charts for f′ and f″.","不能只看 f′=0 就断定最大或最小。"],["Absolute extrema on [a,b] require checking endpoints.","闭区间最值法比较端点与区间内所有临界点的函数值。","Evaluate f at every candidate and compare.","只检查导数为零的点会漏掉端点最值。"],["Derivative graphs reveal where the original function changes.","从 f′ 图像读出 f 的增减；从 f″ 或 f′ 的斜率读出凹凸。","A sign change + to − in f′ gives a local max.","f′ 图像的高度不是原函数 f 的高度。"],["Optimization converts words into an objective function.","优化题先定义变量、建立约束、写目标函数，再求导找最值。","Use constraints to reduce to one variable.","不要在没有检验端点与定义域时宣称全局最优。"],["A graph of f′ gives slopes of f, not values of f.","导函数的正负决定原函数增减；导函数过零处可能有极值。","Inspect sign changes rather than just zero crossings.","导函数图像上的极大点不等于原函数的极大点。"],["Position, velocity and acceleration are successive derivatives.","s′(t)=v(t)，v′(t)=a(t)；速度符号决定运动方向。","Speed is |v(t)|, not v(t).","速度为负时速率仍为非负。"],["For vector motion, differentiate components.","平面位置向量 r(t)=⟨x(t),y(t)⟩，速度为 r′(t)，速率为 |r′(t)|。","Compute speed using the Pythagorean norm.","向量速度和标量速率不同。"],["Linearization uses a tangent-line approximation.","线性化 L(x)=f(a)+f′(a)(x−a)，适合 x 接近 a 时近似。","Choose a nearby a with easy function values.","离展开点太远时近似误差可能变大。"],["Related rates differentiate geometric relationships in time.","相关变化率题先写几何等式，再对时间 t 求导。","Apply chain rule, then substitute given instantaneous values.","应先求导再代入瞬时数值，避免把变化量当常数。"],["Polar tangent slopes require parametric differentiation.","极坐标 x=r cosθ，y=r sinθ，因此 dy/dx=[r′sinθ+r cosθ]/[r′cosθ−r sinθ]。","Differentiate with respect to θ.","不要忽略 r 也可能依赖 θ。"]],[["Antiderivatives reverse derivatives.","原函数 F 满足 F′=f；不定积分是所有原函数的集合。","Check your answer by differentiating it.","别忘记 +C。"],["Basic integral formulas reverse power and trig derivatives.","当 n≠−1 时 ∫xⁿdx=xⁿ⁺¹/(n+1)+C；∫cos xdx=sin x+C。","Treat n=−1 separately with ln|x|.","n=−1 时不能套普通幂积分公式。"],["Partial fractions simplify rational integrals.","部分分式把有理式拆成简单分母项，常得到对数形式的原函数。","Factor the denominator and solve coefficients.","先检查分子次数是否小于分母次数。"],["Integration by parts reverses the product rule.","分部积分公式 ∫u dv=uv−∫v du，适合多项式乘指数/三角函数。","Choose u to simplify when differentiated.","注意公式中的负号，且不要遗漏剩余积分。"],["Differential equations can be solved by integration.","已知 y′=f(x) 时积分得到 y=F(x)+C，再用初值求 C。","Verify by differentiating and checking the initial condition.","解微分方程不只写一个不定积分，还要处理初值。"]],[["The FTC connects accumulation and antiderivatives.","微积分基本定理：若 F′=f，则 ∫ₐᵇ f=F(b)−F(a)；变上限积分求导还原被积函数。","Check continuity assumptions on the interval.","注意积分上下限的顺序。"],["Definite integrals are linear and additive over intervals.","∫ₐᵇ(f+g)=∫ₐᵇf+∫ₐᵇg；∫ₐᶜf+∫꜀ᵇf=∫ₐᵇf。","Reversing bounds changes the sign.","定积分是带符号面积，不一定为正。"],["Riemann sums approximate area using rectangles.","黎曼和 Σf(xᵢ*)Δx；等宽分割 Δx=(b−a)/n，n→∞ 时趋于积分。","Identify left/right/midpoint sampling points.","不要漏乘 Δx。"],["Differentiate accumulation functions with variable bounds.","若 G(x)=∫ₐᵍ⁽ˣ⁾ f(t)dt，则 G′(x)=f(g(x))g′(x)。","Use FTC followed by the chain rule.","变上限是 x² 时必须乘 2x。"],["Trapezoid and midpoint rules approximate definite integrals.","梯形法用相邻端点平均高度；中点法用区间中点高度。","Use correct subinterval width h.","不能混淆梯形公式与中点公式。"],["Accumulation functions are analyzed using their derivatives.","若 A(x)=∫ₐˣ f(t)dt，则 A′(x)=f(x)，A 的增减取决于 f 的符号。","Find where the integrand crosses zero.","被积函数的正负对应累积函数的增减。"],["The natural logarithm can be defined as area.","对 x>0，ln x=∫₁ˣ 1/t dt，因此 (ln x)′=1/x。","Use logarithm laws only for positive arguments.","ln|x| 的导数在 x≠0 时为 1/x。"],["Average value is integral divided by interval length.","函数在 [a,b] 的平均值为 (1/(b−a))∫ₐᵇ f(x)dx。","Compute the definite integral before dividing.","不要把平均值与最大值混淆。"]],[["Area between curves uses upper minus lower.","两曲线围成面积 ∫(上方−下方)dx；若上下关系改变需分段。","Find intersection points for bounds.","直接对差积分可能得到负数，面积应非负。"],["Polar area uses half the integral of r squared.","极坐标面积 A=(1/2)∫ᵅᵝ r(θ)²dθ。","Sketch or inspect the angular interval first.","不要漏掉 1/2；注意是否重复扫过区域。"],["Volume by disks/washers integrates cross-sectional area.","圆盘法 V=π∫R²dx；垫片法 V=π∫(R²−r²)dx。","Identify rotation axis and outer/inner radii.","半径是到旋转轴的距离，不一定等于 y。"],["Arc length adds infinitesimal distances.","曲线 y=f(x) 在 [a,b] 的弧长 L=∫ₐᵇ√(1+[f′(x)]²)dx。","Differentiate first, then build the square root.","不要把弧长与曲线下方面积混淆。"],["Improper integrals use limits at infinity or singularities.","反常积分需将无穷界或奇点换成极限，极限有限才收敛。","For ∫₁∞1/xᵖdx, convergence requires p>1.","不能把 ∞ 当作普通数代入原函数。"]],[["Displacement integrates velocity; distance integrates speed.","位移 Δs=∫v(t)dt；总路程=∫|v(t)|dt。","Split at times where v changes sign.","速度有负值时位移和路程可能不同。"],["Plane motion uses vector-valued position and velocity.","平面运动位移 r(b)−r(a)；路程积分速度向量的模长。","Differentiate x(t) and y(t) separately.","不要把 x、y 两方向的位移长度直接相加当路程。"],["Riemann sums approximate accumulated quantities from rate data.","变化率表格可用左端点、右端点或梯形法估算总变化。","Multiply each sampled rate by time width.","注意速率单位乘时间后得到总量单位。"],["Net change theorem links rate to total change.","净变化量=∫变化率 dt；最终量=初始量+净变化量。","Keep track of signed inflow/outflow.","积分给的是变化量，不一定是最终总量。"]],[["Differential equations describe functions through derivatives.","微分方程给出 y 与 y′ 的关系；通解含常数，特解满足初值。","Check proposed solutions by substitution.","要区分通解与满足初值的特解。"],["Slope fields visualize y′=F(x,y).","斜率场在每点 (x,y) 画出斜率 F(x,y) 的短线段。","Evaluate the equation at several grid points.","斜率场给方向信息，不直接给唯一解曲线。"],["Euler's method takes small tangent steps.","欧拉法 yₙ₊₁=yₙ+hF(xₙ,yₙ)，xₙ₊₁=xₙ+h。","Use slope at the start of each step.","每一步必须更新 x 与 y，再算下一步斜率。"],["Separable equations isolate y and x factors.","可分离方程把 y 项放一侧、x 项放另一侧，再分别积分。","Check constant/equilibrium solutions lost by division.","除以 y 时可能漏掉 y=0 这类平衡解。"],["Exponential growth has rate proportional to amount.","若 y′=ky，则 y=Ceᵏᵗ；k>0 增长，k<0 衰减。","Use initial value to determine C.","指数模型的增长率是相对速率，不是固定增加量。"],["Logistic growth slows near carrying capacity K.","逻辑斯蒂方程 P′=kP(1−P/K)，K 是环境容纳量。","Inspect the sign of P′ below and above K.","不能把逻辑斯蒂模型当作无限指数增长。"]],[["Sequences converge when terms approach a finite limit.","数列收敛是 aₙ 随 n→∞ 趋向有限数；否则发散。","Compare leading powers for rational expressions in n.","数列项趋于 0 不足以保证对应级数收敛。"],["Series convergence requires checking partial sums.","级数 Σaₙ 的收敛取决于部分和极限；几何级数 |r|<1 时收敛。","Try geometric, p-series, ratio or alternating tests.","aₙ→0 只是级数收敛的必要条件，不是充分条件。"],["Taylor series approximates functions with derivatives.","泰勒展开 Σ f⁽ⁿ⁾(a)(x−a)ⁿ/n!；在 a=0 称麦克劳林展开。","Check interval/radius of convergence and remainder.","多项式近似在展开点附近通常更准确，不能忽略收敛区间。"]]];
const DEEP_CORE=[["Functions map inputs to outputs; check domains and representations.", "函数将输入映射到输出，注意定义域和多种表示。"], ["A limit describes nearby behavior, not necessarily the value at the point.", "极限描述附近趋势，不一定等于该点函数值。"], ["Derivatives are instantaneous rates of change and tangent slopes.", "导数表示瞬时变化率和切线斜率。"], ["The signs of f′ and f″ describe monotonicity and concavity.", "一、二阶导数的符号描述增减和凹凸。"], ["Integration reverses differentiation; indefinite integrals include +C.", "积分是求导的逆过程，不定积分要加 +C。"], ["Definite integrals measure signed accumulation; use the FTC.", "定积分表示带符号累积量，使用微积分基本定理。"], ["Choose bounds and cross-sections before computing area or volume.", "求面积或体积前先确定积分界限和截面。"], ["Integrate rates for net change; integrate |velocity| for distance.", "对变化率积分得净变化，对速度绝对值积分得路程。"], ["Differential equations link a function with its derivatives.", "微分方程联系未知函数及其导数。"], ["Check convergence before using infinite sums or Taylor expansions.", "使用无穷级数或泰勒展开前先判断收敛性。"]];

[['FTC / 微积分基本定理','∫ₐᵇf(x)dx=F(b)−F(a), where F′=f. / 用原函数的上下限差计算定积分。'],['Average value / 平均值','f_avg=(1/(b−a))∫ₐᵇf(x)dx. / 将积分除以区间长度。']],

function finishExamConfirm(){if(confirm(label('Submit your exam now?','确定现在交卷吗？')))finishExam()}
function finishExam(){if(examTimer){clearInterval(examTimer);examTimer=null}if(!exam)return;exam.finished=true;view='examResult';render()}
function examResult(){let score=exam.ids.reduce((sum,id,i)=>sum+(exam.answers[i]===allMCQ[id].correct?1:0),0);$('content').innerHTML='<div class="eyebrow">EXAM RESULTS</div><h1>'+label('Your exam report','模拟考试成绩报告')+'</h1><div class="card"><div class="result-big">'+score+' / 20</div><h3>'+Math.round(score*5)+'% '+label('accuracy','正确率')+'</h3><p class="muted">'+label('Unanswered items count as incorrect. Results are not an official AP 1–5 score.','未答题按错误计，成绩不等同于官方 AP 1–5 分换算。')+'</p><div class="actions"><button class="btn" onclick="go(\'examSetup\')">'+label('New exam','重新组卷')+'</button><button class="btn secondary" onclick="go(\'stats\')">'+label('Learning analytics','学习统计')+'</button></div></div><div class="section"><h2>'+label('Answer explanations','试题逐题解析')+'</h2></div>'+exam.ids.map((id,i)=>{let q=allMCQ[id],good=exam.answers[i]===q.correct;return '<div class="card" style="margin:12px 0"><div class="between"><b>'+(i+1)+'. '+split(q.en,q.zh)+'</b><span class="tag '+(good?'':'bc')+'">'+(good?'✓':'✕')+'</span></div><p class="tiny">'+label('Your answer','你的答案')+': '+(exam.answers[i]===undefined?'—':String.fromCharCode(65+exam.answers[i]))+' · '+label('Correct','正确答案')+': '+String.fromCharCode(65+q.correct)+'</p><div class="note">'+split(q.expEn,q.expZh)+'</div></div>'}).join('')}
$('lang').addEventListener('change',e=>{store.lang=e.target.value;save();render()});$('course').addEventListener('change',e=>{store.course=e.target.value;save();go('home')});render();
</script></body></html>
